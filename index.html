<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3efe5" />
    <meta name="description" content="" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="%BASE_URL%favicon-light.svg"
      data-theme-favicon
      data-light="%BASE_URL%favicon-light.svg"
      data-dark="%BASE_URL%favicon-dark.svg"
    />
    <title></title>
    <script>
      (() => {
        let theme;
        let lang;
        try { theme = localStorage.getItem('theme'); lang = localStorage.getItem('lang'); } catch {}
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.classList.add(theme);
        document.documentElement.style.colorScheme = theme;
        const favicon = document.querySelector('[data-theme-favicon]');
        if (favicon) favicon.href = theme === 'dark' ? favicon.dataset.dark : favicon.dataset.light;
        document.documentElement.lang = (lang || navigator.language).toLowerCase().startsWith('zh') ? 'zh-CN' : 'en';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
